<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروع إيجاليس - لوحة تحكم التداول عالي التردد</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tajawal', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            direction: rtl;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        
        .status-label {
            font-weight: 600;
            color: #555;
        }
        
        .status-value {
            color: #667eea;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .metric-card {
            text-align: center;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 8px;
        }
        
        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
            margin: 10px 0;
        }
        
        .metric-label {
            color: #777;
            font-size: 0.9rem;
        }
        
        .language-switch {
            text-align: center;
            margin-top: 30px;
        }
        
        .language-btn {
            padding: 10px 20px;
            background: #34495e;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 10px;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #777;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .metrics-grid {
                grid-template-columns: 1fr;
            }
            
            .controls {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>مشروع إيجاليس</h1>
            <p class="subtitle">نظام التداول عالي التردد</p>
        </header>
        
        <div class="dashboard">
            <div class="card">
                <h2>التحكم بالنظام</h2>
                <div class="controls">
                    <button id="stopBtn" class="btn btn-danger">إيقاف محرك HFT</button>
                    <button id="startBtn" class="btn btn-primary">تشغيل محرك HFT</button>
                </div>
            </div>
            
            <div class="card">
                <h2>حالة النظام</h2>
                <div class="status-grid" id="statusGrid">
                    <div class="status-item">
                        <span class="status-label">الحالة:</span>
                        <span class="status-value" id="statusValue">متوقف</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">مدة التشغيل:</span>
                        <span class="status-value" id="uptimeValue">0س 0د</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">العملات:</span>
                        <span class="status-value" id="symbolsValue">BTCUSDT, ETHUSDT</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">آخر تحديث:</span>
                        <span class="status-value" id="lastUpdateValue">-</span>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <h2>مؤشرات الأداء</h2>
                <div class="metrics-grid" id="metricsGrid">
                    <div class="metric-card">
                        <div class="metric-label">الأحداث المعالجة</div>
                        <div class="metric-value" id="eventsValue">0</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">الزمن المستغرق</div>
                        <div class="metric-value" id="latencyValue">0μs</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">استخدام الذاكرة</div>
                        <div class="metric-value" id="memoryValue">0MB</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">استخدام المعالج</div>
                        <div class="metric-value" id="cpuValue">0%</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="language-switch">
            <button class="language-btn" onclick="switchLanguage('en')">English</button>
        </div>
        
        <footer>
            <p>مشروع إيجاليس - النسخة المستقلة لويندوز | لأغراض تعليمية فقط</p>
        </footer>
    </div>
    
    <script>
        // Initialize Socket.IO
        const socket = io();
        
        // DOM Elements
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusValue = document.getElementById('statusValue');
        const uptimeValue = document.getElementById('uptimeValue');
        const symbolsValue = document.getElementById('symbolsValue');
        const lastUpdateValue = document.getElementById('lastUpdateValue');
        const eventsValue = document.getElementById('eventsValue');
        const latencyValue = document.getElementById('latencyValue');
        const memoryValue = document.getElementById('memoryValue');
        const cpuValue = document.getElementById('cpuValue');
        
        // Event Listeners
        startBtn.addEventListener('click', startHFT);
        stopBtn.addEventListener('click', stopHFT);
        
        // Socket.IO Events
        socket.on('systemUpdate', (data) => {
            updateDashboard(data);
        });
        
        // Functions
        async function startHFT() {
            try {
                startBtn.disabled = true;
                const response = await fetch('/api/hft/start', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                const result = await response.json();
                if (result.success) {
                    console.log('تم تشغيل محرك HFT');
                }
            } catch (error) {
                console.error('خطأ في تشغيل محرك HFT:', error);
            } finally {
                startBtn.disabled = false;
            }
        }
        
        async function stopHFT() {
            try {
                stopBtn.disabled = true;
                const response = await fetch('/api/hft/stop', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                const result = await response.json();
                if (result.success) {
                    console.log('تم إيقاف محرك HFT');
                }
            } catch (error) {
                console.error('خطأ في إيقاف محرك HFT:', error);
            } finally {
                stopBtn.disabled = false;
            }
        }
        
        function updateDashboard(data) {
            statusValue.textContent = data.running ? 'قيد التشغيل' : 'متوقف';
            statusValue.style.color = data.running ? '#27ae60' : '#e74c3c';
            
            uptimeValue.textContent = data.uptime;
            symbolsValue.textContent = data.symbols.join('، ');
            lastUpdateValue.textContent = new Date(data.lastUpdate).toLocaleTimeString('ar-SA');
            
            eventsValue.textContent = data.metrics.eventsProcessed.toLocaleString('ar-SA');
            latencyValue.textContent = data.metrics.latency;
            memoryValue.textContent = data.metrics.memoryUsage;
            cpuValue.textContent = data.metrics.cpuUsage;
        }
        
        function switchLanguage(lang) {
            if (lang === 'en') {
                window.location.href = '/';
            }
        }
        
        // Initial status check
        async function checkStatus() {
            try {
                const response = await fetch('/api/hft/status');
                const result = await response.json();
                if (result.success) {
                    updateDashboard(result.status);
                }
            } catch (error) {
                console.error('خطأ في جلب الحالة:', error);
            }
        }
        
        // Check status on load
        checkStatus();
    </script>
</body>
</html>
