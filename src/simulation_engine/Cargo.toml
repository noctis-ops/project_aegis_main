[package]
name = "simulation-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
parquet = "50.0"
arrow = "50.0"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
async-trait = "0.1"
teloxide = "0.12"
uuid = { version = "1.0", features = ["v4"] }