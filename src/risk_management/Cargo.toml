[package]
name = "risk-management"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
dashmap = "5.0"
crossbeam = "0.8"
thiserror = "1.0"
reqwest = { version = "0.11", features = ["json"] }